[package]
name = "ytcli"
version = "0.1.0"
edition = "2021"
description = "CLI ligera para escuchar YouTube vía yt-dlp + mpv"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = true, features = ["blocking", "json"] }
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
